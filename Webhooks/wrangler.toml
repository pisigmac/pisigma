name = "pisigma-webhooks"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "pisigma-webhooks"
database_id = "00000000-0000-0000-0000-000000000004"
migrations_dir = "migrations"

# Retry due deliveries every minute (1m / 5m / 30m backoff schedule).
# Alternative: external cron → POST /v1/internal/retry with X-Admin-Token.
[triggers]
crons = ["* * * * *"]

# Secrets (wrangler secret put …):
#   WEBHOOKS_ADMIN_TOKEN
